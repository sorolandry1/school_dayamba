# ============================================================
#  SchoolPro — Production
#  Usage: docker compose up -d --build
#  App: http://localhost:3000
# ============================================================

services:

  # ---- PostgreSQL ----
  db:
    image: postgres:16-alpine
    container_name: schoolpro-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-school_management}
      POSTGRES_USER: ${DB_USER:-schoolpro}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-schoolpro_secret_2026}
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-schoolpro} -d ${DB_NAME:-school_management}"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks:
      - schoolpro_net

  # ---- Django Backend ----
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: schoolpro-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      USE_POSTGRES: "true"
      DB_NAME: ${DB_NAME:-school_management}
      DB_USER: ${DB_USER:-schoolpro}
      DB_PASSWORD: ${DB_PASSWORD:-schoolpro_secret_2026}
      DB_HOST: db
      DB_PORT: "5432"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
    volumes:
      - backend_media:/app/media
      - backend_static:/app/staticfiles
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/auth/login/')\" 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - schoolpro_net

  # ---- React Frontend (Nginx) ----
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: "/api"
    container_name: schoolpro-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - schoolpro_net

volumes:
  postgres_data:
  backend_media:
  backend_static:

networks:
  schoolpro_net:
    driver: bridge