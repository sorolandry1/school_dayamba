version: "3.9"

# ============================================================
#  SchoolPro — Production
#  Usage: docker compose up -d --build
#  App: http://localhost:3000
# ============================================================

services:

  # ---- PostgreSQL ----
  db:
    image: postgres:16-alpine
    container_name: schoolpro-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: school_management
      POSTGRES_USER: schoolpro
      POSTGRES_PASSWORD: schoolpro_secret_2026
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schoolpro -d school_management"]
      interval: 5s
      timeout: 5s
      retries: 15

  # ---- Django Backend ----
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: schoolpro-backend
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: "change-this-secret-key-in-production-2026"
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,backend,*"
      USE_POSTGRES: "true"
      DB_NAME: school_management
      DB_USER: schoolpro
      DB_PASSWORD: schoolpro_secret_2026
      DB_HOST: db
      DB_PORT: "5432"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost,http://127.0.0.1:3000"
    volumes:
      - backend_media:/app/media
      - backend_static:/app/staticfiles
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # ---- React Frontend (Nginx) ----
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: "/api"
    container_name: schoolpro-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_media:
  backend_static:
