<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a365d" />
  <meta name="description" content="SchoolPro — Plateforme de Gestion Scolaire" />
  <meta name="application-name" content="SchoolPro" />

  <!-- Security headers via meta (complements server-side headers) -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta http-equiv="X-Frame-Options" content="DENY" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />

  <!-- PWA / mobile -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="SchoolPro" />
  <meta name="format-detection" content="telephone=no" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />

  <title>SchoolPro - Gestion Scolaire</title>

  <style>
    /* Prevent flash of unstyled content */
    body { margin: 0; background: #f9fafb; }
    #root { min-height: 100vh; }
  </style>
</head>
<body>
  <noscript>
    <div style="padding:40px;text-align:center;font-family:sans-serif;color:#667085">
      <strong>SchoolPro</strong> nécessite JavaScript pour fonctionner.
      Veuillez activer JavaScript dans votre navigateur.
    </div>
  </noscript>
  <div id="root"></div>
</body>
</html>
