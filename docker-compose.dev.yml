version: "3.9"

# ============================================================
#  SchoolPro — Développement (hot reload)
#  Usage: docker compose -f docker-compose.dev.yml up --build
# ============================================================

services:

  # ---- PostgreSQL ----
  db:
    image: postgres:16-alpine
    container_name: schoolpro-db-dev
    environment:
      POSTGRES_DB: school_management
      POSTGRES_USER: schoolpro
      POSTGRES_PASSWORD: schoolpro_dev
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schoolpro -d school_management"]
      interval: 5s
      timeout: 5s
      retries: 15

  # ---- Django Backend (runserver avec volume monté) ----
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: schoolpro-backend-dev
    environment:
      DJANGO_SECRET_KEY: "dev-secret-key-not-for-production"
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: "*"
      USE_POSTGRES: "true"
      DB_NAME: school_management
      DB_USER: schoolpro
      DB_PASSWORD: schoolpro_dev
      DB_HOST: db
      DB_PORT: "5432"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
    volumes:
      - ./backend:/app
      - dev_media:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # ---- React Frontend (npm start avec hot reload) ----
  frontend:
    image: node:20-alpine
    container_name: schoolpro-frontend-dev
    working_dir: /app
    environment:
      - REACT_APP_API_URL=http://localhost:8000/api
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    command: sh -c "npm install --legacy-peer-deps 2>/dev/null && npm start"
    depends_on:
      - backend

volumes:
  postgres_data_dev:
  dev_media:
