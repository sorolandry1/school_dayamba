# ============================================================
#  SchoolPro — Développement (hot reload)
#  Usage: docker compose -f docker-compose.dev.yml up --build
# ============================================================

services:

  # ---- PostgreSQL ----
  db:
    image: postgres:16-alpine
    container_name: schoolpro-db-dev
    restart: unless-stopped
    env_file:
      - .env                    # ✅ corrigé : pointe sur .env
    environment:
      POSTGRES_DB: ${DB_NAME:-school_management}
      POSTGRES_USER: ${DB_USER:-schoolpro}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-schoolpro_dev}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-schoolpro} -d ${DB_NAME:-school_management}"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks:
      - schoolpro_dev_net

  # ---- Django Backend (runserver avec volume monté) ----
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: schoolpro-backend-dev
    restart: unless-stopped
    env_file:
      - .env                    # ✅ corrigé : pointe sur .env
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-secret-key-not-for-production}
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      USE_POSTGRES: "true"
      DB_NAME: ${DB_NAME:-school_management}
      DB_USER: ${DB_USER:-schoolpro}
      DB_PASSWORD: ${DB_PASSWORD:-schoolpro_dev}
      DB_HOST: db
      DB_PORT: "5432"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
    volumes:
      - ./backend:/app
      - dev_media:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/auth/login/')\" 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - schoolpro_dev_net

  # ---- React Frontend (npm start avec hot reload) ----
  frontend:
    image: node:20-alpine
    container_name: schoolpro-frontend-dev
    restart: unless-stopped
    working_dir: /app
    environment:
      - REACT_APP_API_URL=http://localhost:8000/api
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - NODE_OPTIONS=--openssl-legacy-provider
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    command: >
      sh -c "npm install --legacy-peer-deps &&
             npm install ajv@^8.0.0 --legacy-peer-deps &&
             npm start"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - schoolpro_dev_net

volumes:
  postgres_data_dev:
  dev_media:

networks:
  schoolpro_dev_net:
    driver: bridge